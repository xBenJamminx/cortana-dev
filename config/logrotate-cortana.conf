# Cortana log rotation.
#
# Install:  cp config/logrotate-cortana.conf /etc/logrotate.d/cortana
# Validate: logrotate -d /etc/logrotate.d/cortana
#
# IMPORTANT: logrotate does not expand environment variables or `~`, so the
# workspace path below must be edited to match the actual checkout on this
# host. Set it once, here.
#
# Only ONE workspace root may be listed. If /root/clawd and
# /root/.openclaw/workspace both resolve to the same directory (symlink),
# listing both makes logrotate fail with "duplicate log entry".

# --- Messaging gateway (Hermes) ---
/root/.hermes/logs/*.log {
    su root root
    daily
    rotate 7
    maxsize 50M
    missingok
    notifempty
    copytruncate
    compress
    delaycompress
    dateext
}

# --- Workspace logs ---
# EDIT THIS PATH to the checkout root on this host.
# Legacy equivalents were /root/clawd/logs and /root/.openclaw/workspace/logs.
/root/cortana-dev/logs/*.log {
    su root root
    weekly
    rotate 4
    maxsize 10M
    missingok
    notifempty
    copytruncate
    compress
    delaycompress
}

# --- System-level logs ---
/var/log/cortana/*.log {
    su root root
    weekly
    rotate 4
    maxsize 10M
    missingok
    notifempty
    copytruncate
    compress
    delaycompress
}

/var/log/cortana-sync.log {
    su root root
    weekly
    rotate 4
    maxsize 10M
    missingok
    notifempty
    copytruncate
    compress
    delaycompress
}
