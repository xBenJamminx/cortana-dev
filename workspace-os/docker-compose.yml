services:
  workspace-os:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - ${CORTANA_WORKSPACE:-..}:/workspace:rw
      - ./workspace.db:/app/backend/workspace.db
    environment:
      - WORKSPACE_ROOT=/workspace
    env_file:
      - .env
    restart: unless-stopped
    network_mode: host  # Host-local integrations; some legacy routes still need OpenClaw compatibility.
